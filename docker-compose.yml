services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ss
      POSTGRES_PASSWORD: ss
      POSTGRES_DB: ss
    ports:
      - "5432:5432"
    volumes:
      - ss-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ss -d ss"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ss-postgres:
